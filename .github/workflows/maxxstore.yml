name: Build Maxx Store APK

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Maxx Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            rm -rf "$ANDROID_HOME/platforms/android-37"
            ln -s \
              "$ANDROID_HOME/platforms/android-37.0" \
              "$ANDROID_HOME/platforms/android-37"
          fi

          echo "Installed SDK:"
          ls -la "$ANDROID_HOME/platforms/"
          ls -la "$ANDROID_HOME/build-tools/"

      - name: Verify MaxxOS namespace
        run: |
          echo "=== APP CONFIG ==="
          grep -nE 'namespace|applicationId' app/build.gradle.kts

          echo
          echo "=== REMAINING AURORA PACKAGE REFERENCES ==="
          if grep -RIn \
            --include='*.kt' \
            --include='*.java' \
            --include='*.kts' \
            --include='*.xml' \
            'com\.aurora\.store' \
            app/src; then
            echo "::warning::Aurora package references still exist"
          else
            echo "No com.aurora.store references found."
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Maxx Store
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleVanillaDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee build.log

      - name: Print Kotlin compiler errors
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "        MAXXOS KOTLIN ERRORS"
          echo "========================================"

          grep -E \
            'e: file:|error:|Unresolved reference|Redeclaration|Cannot access|Type mismatch|Conflicting overloads' \
            build.log || true

          echo
          echo "========================================"
          echo "        LAST 250 BUILD LINES"
          echo "========================================"

          tail -n 250 build.log

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK generated"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "APK: $APK"

          cp "$APK" release/MaxxStore-debug.apk

          ls -lh release/MaxxStore-debug.apk

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="maxxstore-${{ github.run_number }}"

          gh release create "$TAG" \
            release/MaxxStore-debug.apk \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Maxx Store $TAG" \
            --generate-notes
