#
# Builds Maxx Store and publishes the APK as a GitHub Pre-release.

name: Build Maxx Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  build:
    name: Build Maxx Store APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ubuntu GitHub runners already contain Android SDK.
      # Do NOT use android-actions/setup-android here because
      # it attempts to install the obsolete "tools" package.

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using:"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo
          echo "Build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo
          echo "ADB:"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew

      - name: Build Maxx Store
        run: |
          ./gradlew :app:assembleVanillaDebug \
            --stacktrace \
            --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          echo "Searching for APK..."

          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Maxx Store APK was not found."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" release/MaxxStore-debug.apk

          echo
          echo "Final APK:"
          ls -lh release/MaxxStore-debug.apk

      - name: Generate release tag
        id: release
        run: |
          TAG="maxxstore-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Publish Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.release.outputs.tag }}" \
            release/MaxxStore-debug.apk \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Maxx Store ${{ steps.release.outputs.tag }}" \
            --generate-notes

      - name: Build Summary
        run: |
          {
            echo "## Maxx Store"
            echo
            echo "### Build successful"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Build: \`${{ github.run_number }}\`"
            echo "- Variant: \`vanillaDebug\`"
            echo "- Package: \`com.maxxos.store\`"
            echo "- Release: GitHub Pre-release"
            echo "- APK: \`MaxxStore-debug.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
