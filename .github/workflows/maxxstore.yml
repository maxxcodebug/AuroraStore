#
# Builds Maxx Store and publishes the APK as a GitHub Pre-release.

name: Build Maxx Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  build:
    name: Build Maxx Store APK
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # JDK 21
      # ----------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ----------------------------------------------------------
      # Android SDK environment only
      # Do NOT pass packages to setup-android.
      # ----------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------
      # Install Android SDK components
      # ----------------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "SDK_ROOT=$SDK_ROOT"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_SDK_ROOT / ANDROID_HOME is not set."
            exit 1
          fi

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          echo
          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true

          echo
          echo "Updating SDK package metadata..."
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --update || true

          echo
          echo "Installing required packages..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0"

      # ----------------------------------------------------------
      # Verify SDK
      # ----------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Installed platforms:"
          find "$SDK_ROOT/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print || true

          echo
          echo "Installed build tools:"
          find "$SDK_ROOT/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print || true

          echo
          echo "ADB:"
          "$SDK_ROOT/platform-tools/adb" version

      # ----------------------------------------------------------
      # Gradle
      # ----------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ----------------------------------------------------------
      # Prepare Gradle
      # ----------------------------------------------------------
      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew

      # ----------------------------------------------------------
      # Build Maxx Store
      # ----------------------------------------------------------
      - name: Build Maxx Store
        run: |
          ./gradlew :app:assembleVanillaDebug \
            --stacktrace \
            --no-daemon

      # ----------------------------------------------------------
      # Prepare APK
      # ----------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          echo "Searching for APK..."

          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Maxx Store APK was not found."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" release/MaxxStore-debug.apk

          echo
          echo "Final APK:"
          ls -lh release/MaxxStore-debug.apk

      # ----------------------------------------------------------
      # Release tag
      # ----------------------------------------------------------
      - name: Generate release tag
        id: release
        run: |
          TAG="maxxstore-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # ----------------------------------------------------------
      # GitHub Pre-release
      # ----------------------------------------------------------
      - name: Publish Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.release.outputs.tag }}" \
            release/MaxxStore-debug.apk \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Maxx Store ${{ steps.release.outputs.tag }}" \
            --generate-notes

      # ----------------------------------------------------------
      # Summary
      # ----------------------------------------------------------
      - name: Build Summary
        run: |
          {
            echo "## Maxx Store"
            echo
            echo "### Build successful"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Build: \`${{ github.run_number }}\`"
            echo "- Variant: \`vanillaDebug\`"
            echo "- Package: \`com.maxxos.store\`"
            echo "- Release: GitHub Pre-release"
            echo "- APK: \`MaxxStore-debug.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
